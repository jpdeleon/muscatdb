name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run ruff
        run: uv run ruff check --output-format=github .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --dev
      - name: Download catalog CSVs
        run: bash scripts/download_catalogs.sh
      - name: Run fast test suite
        run: uv run pytest --tb=short -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Download catalog CSVs
        run: bash scripts/download_catalogs.sh
      # --cov-fail-under makes this a real gate. Without it the job passes as long
      # as the suite runs, so as a *required* status check it looked like a
      # guardrail while enforcing nothing. The floor is a ratchet, set just below
      # the current level (CI ~69%, local ~68% -- they differ because some tests
      # skip without the external conda tools) so ordinary variance cannot fail a
      # PR. Raise it as coverage improves; the target is 80%.
      - name: Run tests with coverage
        run: uv run pytest --tb=short -q --cov=src/muscat_db --cov-report=xml --cov-report=term-missing --cov-fail-under=68
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
